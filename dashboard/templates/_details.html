<div class="mb-3">
  <div class="flex items-center justify-between mb-2">
    <h3 class="font-medium text-sm">{{ title }}</h3>
    <div class="space-x-2">
      <button class="btn btn-xs"
        onclick="navigator.clipboard.writeText(document.getElementById('detail-json').textContent)">Copy</button>
    </div>
  </div>
  <pre id="detail-json" class="json text-xs bg-base-300 p-2 rounded overflow-auto">{{ body }}</pre>
</div>
